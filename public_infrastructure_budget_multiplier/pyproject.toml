[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public_infrastructure_budget_multiplier"
version = "0.1.0"
description = "An explainable cost and schedule risk estimator for public infrastructure projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "public_infrastructure_budget_multiplier contributors" }]
keywords = ["infrastructure", "risk", "cost-estimation", "schedule", "public-projects"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.scripts]
public_infrastructure_budget_multiplier = "public_infrastructure_budget_multiplier.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

